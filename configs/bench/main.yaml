    defences: [D0, D1, D2, D3]
    n: 100
    memory_state: warm
    fatigued_rerun: true
  - families: [legit_update]
    defences: [D0, D1, D2, D3]
    n: 130
    memory_state: warm
  - families: [benign]
    defences: [D0, D1, D2, D3]
    n: 100
    memory_state: warm
