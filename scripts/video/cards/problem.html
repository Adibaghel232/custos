<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Custos problem</title><link rel="stylesheet" href="common.css">
<style>
 h2 { position:absolute; top: 70px; left: 0; right: 0; text-align:center; font-size: 56px; font-weight: 700; }
 h2 span { color: var(--green); }
 #tl { position:absolute; left: 90px; top: 250px; width: 1740px; height: 420px; }
 .chips { position:absolute; left: 90px; right: 90px; bottom: 56px; display:flex; gap: 26px; justify-content:center; }
 .chip { flex: 1; background: var(--panel); border: 1.5px solid var(--border); border-radius: 18px; padding: 22px 26px; font-size: 30px; line-height: 1.3; }
 .chip b { color: var(--text); } .chip small { display:block; margin-top: 8px; color: var(--muted); font-size: 24px; }
 .chip.k { border-color: rgba(118,185,0,.7); } .chip.k b { color: var(--green); }
 .node rect { fill: var(--panel2); stroke: var(--border); stroke-width: 2; rx: 14; }
 .node text { fill: var(--text); font-size: 30px; font-weight: 700; text-anchor: middle; }
 .node { opacity: 0; transition: opacity .5s; } .node.on { opacity: 1; }
 .lab { fill: var(--muted); font-size: 26px; text-anchor: middle; opacity: 0; transition: opacity .6s; } .lab.on { opacity: 1; }
 #mail, #pay { opacity: 0; transition: opacity .6s, transform .6s; transform: translateY(-30px); }
 #mail.on, #pay.on { opacity: 1; transform: none; }
 #arc { fill: none; stroke: var(--red); stroke-width: 5; stroke-dasharray: 3 14; stroke-linecap: round; stroke-dashoffset: 1500; }
 #arc.on { transition: stroke-dashoffset 3.2s ease-in-out; stroke-dashoffset: 0; }
</style></head><body><div class="glow"></div>
<h2 class="fade" id="h">One false memory. <span>Many sessions later</span>, a wrong payment.</h2>
<svg id="tl" viewBox="0 0 1740 420"></svg>
<div class="chips">
 <div class="chip fade" id="c1"><b>MINJA · AgentPoison</b><small>published memory-poisoning attacks</small></div>
 <div class="chip fade" id="c2"><b>OWASP Agentic Top 10</b><small>ASI06 · Memory &amp; Context Poisoning</small></div>
 <div class="chip fade k" id="c3"><b>Detectors ask:</b> does this text look malicious?<br><b>Custos asks:</b> where did it come from?</div>
</div>
<script>
 const D = parseFloat(new URLSearchParams(location.search).get('d') || '26');
 const NS='http://www.w3.org/2000/svg', svg=document.getElementById('tl'); const x0=95, dx=194;
 const at=(f,fn)=>setTimeout(fn, D*1000*f);
 const nodes=[]; for(let i=1;i<=9;i++){ const g=document.createElementNS(NS,'g'); g.setAttribute('class','node'); g.setAttribute('transform',`translate(${x0+(i-1)*dx-50},230)`);
   g.innerHTML=`<rect width="100" height="100"/><text x="50" y="64">S${i}</text>`; svg.appendChild(g); nodes.push(g);
   if(i>1){ const l=document.createElementNS(NS,'line'); l.setAttribute('x1',x0+(i-2)*dx+50); l.setAttribute('x2',x0+(i-1)*dx-50); l.setAttribute('y1',280); l.setAttribute('y2',280); l.setAttribute('stroke','#24324F'); l.setAttribute('stroke-width',3); svg.insertBefore(l,svg.firstChild);} }
 const cx3=x0+2*dx, cx9=x0+8*dx;
 svg.insertAdjacentHTML('beforeend', `
  <g transform="translate(${cx3-44},84)"><g id="mail"><rect width="88" height="64" rx="10" fill="#2a2110" stroke="#F5A623" stroke-width="3"/><path d="M6 8l38 28 38-28" fill="none" stroke="#F5A623" stroke-width="3.5"/></g></g>
  <text class="lab" id="l3" x="${cx3}" y="60" style="fill:#F5A623">email · T0 untrusted</text>
  <g transform="translate(${cx9-44},84)"><g id="pay"><rect width="88" height="64" rx="10" fill="#2a1214" stroke="#E5484D" stroke-width="3"/><text x="44" y="46" text-anchor="middle" font-size="40" font-weight="800" fill="#E5484D">₹</text></g></g>
  <text class="lab" id="l9" x="${cx9}" y="60" style="fill:#E5484D">wrong payment</text>
  <path id="arc" d="M ${cx3} 160 C ${cx3+200} -40, ${cx9-200} -40, ${cx9} 160"/>
  <text class="lab" id="lm" x="${(cx3+cx9)/2}" y="150">no single step looks wrong</text>`);
 nodes.forEach((n,i)=>at(0.02+i*0.012,()=>n.classList.add('on')));
 at(0.04,()=>document.getElementById('h').classList.add('on'));
 at(0.17,()=>{document.getElementById('mail').classList.add('on');document.getElementById('l3').classList.add('on');});
 at(0.30,()=>{document.getElementById('arc').classList.add('on');document.getElementById('lm').classList.add('on');});
 at(0.50,()=>{document.getElementById('pay').classList.add('on');document.getElementById('l9').classList.add('on');});
 at(0.60,()=>document.getElementById('c1').classList.add('on'));
 at(0.72,()=>document.getElementById('c2').classList.add('on'));
 at(0.84,()=>document.getElementById('c3').classList.add('on'));
</script></body></html>
