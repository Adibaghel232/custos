[project]
name = "custos"
version = "0.1.0"
description = "Custos: chain of custody for agent memory, plus Custos-Bench (AEGIS 2026, PS-04)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.40",
    "tenacity>=8.2",
    "orjson>=3.9",
    "numpy>=1.26",
    "cryptography>=42",
    "rapidfuzz>=3.6",
    "python-ulid>=2.2",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
mem0 = ["mem0ai"]
guardrails = ["nemoguardrails"]
otel = ["opentelemetry-sdk", "opentelemetry-exporter-otlp"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
custos-bench = "custos_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custos", "src/agent", "src/custos_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
addopts = "-m \"not live\""
markers = ["live: calls real NVIDIA endpoints (run with -m live)"]

[tool.ruff]
line-length = 110
target-version = "py311"
